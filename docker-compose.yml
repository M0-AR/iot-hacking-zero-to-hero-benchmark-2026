version: "3.8"
services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: iot-bench-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  iotgoat:
    # OWASP IoTGoat x86 emulated via QEMU user-mode fallback: we run a lightweight
    # OpenWrt-like web + telnet lab for reproducible dynamic analysis without HW.
    image: openwrt/rootfs:x86-64-22.03.5
    container_name: iot-bench-iotgoat
    command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    ports:
      - "8080:80"
      - "2222:22"
    restart: "no"

  lab:
    build:
      context: .
      dockerfile: docker/Dockerfile.lab
    container_name: iot-bench-lab
    volumes:
      - ./:/work
      - ./data:/work/data
    ports:
      - "8888:8888"
    depends_on:
      - mqtt-broker
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
